<html lang="en">

    <main class="canvas" aria-label="Cedarwood Close">
      <svg
        class="mark"
        viewBox="0 0 960 520"

        aria-label="cedar"
        preserveAspectRatio="xMidYMid meet"

        <text class="wordmark" x="50%" y="56%" text-anchor="middle">
          <tspan class="letter-orange">c</tspan><tspan class="letter-green">e</tspan><tspan class="letter-ochre">d</tspan><tspan class="letter-lavender">a</tspan><tspan class="letter-brown">r</tspan>
